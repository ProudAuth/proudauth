# Standalone image-based local deployment. Run ./start.sh from this folder.
name: ${COMPOSE_PROJECT_NAME:-proudauth-image}

x-proudauth: &proudauth
  image: ${PROUDAUTH_IMAGE:?Set PROUDAUTH_IMAGE in .env}
  platform: ${PROUDAUTH_PLATFORM:-linux/arm64}
  pull_policy: never
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 30s
  volumes:
    - ./${PROUDAUTH_CONFIG_FILE:-config.yaml}:/etc/proudauth/config.yaml:ro
  secrets: [root_key, database_url]
  environment:
    PROUDAUTH_CONFIG: /etc/proudauth/config.yaml
    PROUDAUTH_PUBLIC_ORIGIN: ${PROUDAUTH_PUBLIC_ORIGIN:-http://localhost:8080}
    PROUDAUTH_TRUSTED_PROXIES: ${PROUDAUTH_TRUSTED_PROXIES:-}
    XDG_CONFIG_HOME: /tmp/proudauth-cli

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    platform: ${PROUDAUTH_PLATFORM:-linux/arm64}
    pull_policy: never
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proudauth}
      POSTGRES_DB: ${POSTGRES_DB:-proudauth}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      # PostgreSQL 18 stores PGDATA below this version-aware volume root.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  migrate:
    <<: *proudauth
    restart: "no"
    entrypoint: ["/usr/local/bin/identity-cli", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  server:
    <<: *proudauth
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROUDAUTH_PORT:-8080}:8080"
      - "127.0.0.1:${PROUDAUTH_OPERATOR_PORT:-9090}:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/identity-cli", "doctor"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

  worker:
    <<: *proudauth
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/identity-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/identity-cli", "doctor"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 10s

  swagger:
    image: ${SWAGGER_IMAGE:-docker.swagger.io/swaggerapi/swagger-ui:latest}
    platform: ${PROUDAUTH_PLATFORM:-linux/arm64}
    pull_policy: never
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /spec/proudauth.yaml
      VALIDATOR_URL: none
    volumes:
      - ./openapi:/spec:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

secrets:
  # prepare-secrets.sh reads .env; file secrets work with read-only containers.
  root_key:
    file: ./secrets/root_key
  database_url:
    file: ./secrets/database_url
  db_password:
    file: ./secrets/db_password

volumes:
  pgdata:
