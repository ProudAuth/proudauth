# HTTPS through the host's Cloudflare Tunnel (DEP-005, SES-010).
# Development mail stays on the loopback-only operator port; this is a test deployment.
mode: development
server:
  public_listen: ":8080"
  internal_listen: ":9090"
  public_origin: "https://id.example.com"
  host_policy: strict
identity:
  default_realm: main
storage:
  database_url: "file:/run/secrets/database_url"
keys:
  root_keys:
    - version: 1
      ref: "file:/run/secrets/root_key"
  active_version: 1
sessions:
  cookie_insecure_dev: false
delivery:
  email:
    adapter: dev_sink
impersonation:
  enabled: false
observability:
  log_format: json
