# Disaster-recovery drill (DEP-019, OPS-007): promotes a streaming standby
# after fencing the primary, and restores a base backup plus archived WAL to a
# point in time, then checks ProudAuth's restore procedure against both
# (scripts/dr-drill.sh, docs/operations/backup-restore.md). It starts its own
# PostgreSQL containers through the runner's Docker and needs no secret.
name: dr-drill

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC

permissions:
  contents: read

jobs:
  dr-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # The latest 1.27 patch, as in ci.yml.
          go-version: "1.27.x"
          check-latest: true
      - name: Disaster-recovery drill
        run: make dr-drill
