# Continuous integration (QA-001, QA-002, SEC-016, DEP-003, GOV-004).
# Every job runs from pinned tool versions; no job needs a project-operated service
# or a secret. The release workflow calls this workflow (workflow_call) and
# publishes only when every job here passes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: proudauth
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: proudauth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proudauth"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PROUDAUTH_TEST_DATABASE_URL: postgres://proudauth:ci-only-password@127.0.0.1:5432/proudauth?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Match the exact release and Docker build toolchain.
          go-version: "1.27.2"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Tests (unit, contract and command packages)
        # tests/e2e runs in the e2e job below, in parallel shards. The JSON
        # stream goes through internal/tools/testreport, which prints a compact
        # log and fails the step when a test skipped outside
        # tests/skip-allowlist.txt, a package failed to build, or no test ran
        # (QA-001). testutil fails, rather than skips, database tests when
        # PROUDAUTH_TEST_DATABASE_URL is missing under CI.
        run: |
          set -o pipefail
          go test $(go list ./... | grep -v '/tests/e2e$') -count=1 -race -timeout 20m -json \
            | go run ./internal/tools/testreport -allowlist tests/skip-allowlist.txt -require-tests
      - name: Provisioning and federation attack suites (M4 exit gate)
        # docs/threat-models/attack-suites.md; a separate step so a failure
        # names the suite.
        run: make attack-suites
      - name: Fuzz smoke
        run: |
          go test ./internal/application -run '^$' -fuzz '^FuzzMatchRedirect$' -fuzztime 30s
          go test ./internal/application -run '^$' -fuzz '^FuzzValidateRedirectRegistration$' -fuzztime 30s
          go test ./internal/platform/canonical -run '^$' -fuzz '^FuzzEmail$' -fuzztime 30s
          go test ./internal/platform/canonical -run '^$' -fuzz '^FuzzDomain$' -fuzztime 30s
          go test ./internal/token -run '^$' -fuzz '^FuzzRejectDuplicateKeys$' -fuzztime 30s
          go test ./internal/authorization -run '^$' -fuzz '^FuzzPolicyDefinition$' -fuzztime 30s
          go test ./internal/platform/reqctx -run '^$' -fuzz '^FuzzParseTraceparent$' -fuzztime 15s
          go test ./internal/egress -run '^$' -fuzz '^FuzzAllowed$' -fuzztime 15s
          go test ./internal/application -run '^$' -fuzz '^FuzzClaimMappings$' -fuzztime 15s

  e2e:
    # tests/e2e: every test runs the server in-process on its own database
    # cloned from a migrated template (internal/testutil). The suite is dealt
    # into four shards by test name (scripts/e2e-shard.sh), so a pull request
    # gets its result in about a quarter of the serial time. Each shard has
    # the same gates as the test job; the image job needs every shard.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: proudauth
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: proudauth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proudauth"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PROUDAUTH_TEST_DATABASE_URL: postgres://proudauth:ci-only-password@127.0.0.1:5432/proudauth?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Match the exact release and Docker build toolchain.
          go-version: "1.27.2"
      - name: End-to-end acceptance tests (shard ${{ matrix.shard }} of 4)
        run: |
          set -o pipefail
          ./scripts/e2e-shard.sh ${{ matrix.shard }} 4 -count=1 -race -timeout 25m -json \
            | go run ./internal/tools/testreport -allowlist tests/skip-allowlist.txt -require-tests

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Match the exact release and Docker build toolchain.
          go-version: "1.27.2"
      - name: Secret scan
        run: ./scripts/check-secrets.sh
      - name: License policy
        run: go mod download && ./scripts/check-licenses.sh
      - name: Vulnerability review
        # v1.1.4 crashes analyzing Go 1.27 sources; keep this pin in step with
        # the binary scans below and in release.yml and the Makefile.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Static analysis
        # 2025.1.1 cannot decode Go 1.27's export-data version 5.
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: Kubernetes manifests render (DEP-013)
        # kubectl is preinstalled on GitHub's Ubuntu runners.
        run: make k8s-validate

  # Language SDK CI and verifier fuzzing live in their standalone repositories;
  # service SDK interoperability and pinned ecosystem evidence stay in this CI.

  dco:
    # Developer Certificate of Origin (CONTRIBUTING.md): every commit of a pull
    # request carries a Signed-off-by trailer. Plain git, no third-party action.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          count=0
          for c in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            count=$((count + 1))
            if ! git log -1 --format=%B "$c" | grep -Eq '^Signed-off-by: .+ <[^<>[:space:]]+@[^<>[:space:]]+>[[:space:]]*$'; then
              # Only the hash is printed: commit messages are contributor-controlled.
              echo "::error::commit ${c} has no Signed-off-by line"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "${missing} of ${count} commits lack a sign-off. Sign them with 'git commit -s' (or 'git rebase --signoff ${BASE_SHA}') and push again."
            exit 1
          fi
          echo "all ${count} commits are signed off"

  image:
    runs-on: ubuntu-24.04
    needs: [test, e2e, checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Match the exact release and Docker build toolchain.
          go-version: "1.27.2"
      - name: Build container image
        run: docker build -t proudauth:ci .
      - name: Vulnerability scan of the image binaries
        # govulncheck needs symbol tables, which the shipped binaries lack
        # (-s -w): on stripped binaries it reports advisories for packages that
        # are not even linked. So the same commands are rebuilt, unstripped,
        # inside the image's own build stage (same toolchain, flags and module
        # versions as the image) and those binaries are scanned.
        run: |
          set -euo pipefail
          docker build --target build -t proudauth:ci-build .
          dir="${RUNNER_TEMP}/image-bin"
          mkdir -p "$dir"
          docker run --rm -v "$dir:/scan" proudauth:ci-build \
            sh -c 'for c in identity-server identity-worker identity-cli; do go build -ldflags=-buildid= -o "/scan/$c" "./cmd/$c"; done'
          for b in "$dir"/identity-*; do
            echo "govulncheck $b"
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary "$b"
          done
      - name: Start the development stack
        # The image just built and scanned, with the stack's own .env.
        env:
          PROUDAUTH_IMAGE: proudauth:ci
        run: docker compose -f deploy/dev/docker-compose.yaml up -d --wait --wait-timeout 300
      - name: Compose smoke test
        run: make smoke
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/dev/docker-compose.yaml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/dev/docker-compose.yaml down -v
