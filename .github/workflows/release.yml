# Release pipeline (DEP-003, DEP-017, GOV-005): versioned images, checksums,
# SBOM and build provenance, all produced from the tagged source. Nothing is
# built for publication until the full CI suite (vet, gofmt, Go tests against
# PostgreSQL, fuzz smoke, secret/license/vulnerability checks, image scan and
# smoke test) has passed on the tagged commit. A successful main CI run for that
# exact immutable commit is reused; otherwise the full reusable CI runs here.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci-status:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.existing.outputs.verified }}
      head_sha: ${{ steps.existing.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check CI for the exact tagged commit
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f "head_sha=${HEAD_SHA}" -f event=push -f branch=main -f per_page=100 > ci-runs.json
          VERIFIED=$(jq -r --arg sha "$HEAD_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .head_branch == "main")] | first | (.status == "completed" and .conclusion == "success")' ci-runs.json)
          echo "verified=${VERIFIED}" >> "$GITHUB_OUTPUT"
          if [ "$VERIFIED" = true ]; then
            echo "Reusing successful full CI for exact commit ${HEAD_SHA}."
          else
            echo "No successful latest main CI run for this exact commit; running full CI."
          fi

  ci:
    needs: [ci-status]
    if: needs.ci-status.outputs.verified != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [ci-status, ci]
    if: ${{ always() && needs.ci-status.result == 'success' && (needs.ci.result == 'success' || needs.ci-status.outputs.verified == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version and commit
        env:
          VERIFIED_SHA: ${{ needs.ci-status.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          # Installers download deploy/prod from this tag: its .env must pin this release.
          grep -qx "PROUDAUTH_IMAGE=ghcr.io/proudauth/proudauth:${GITHUB_REF_NAME#v}" deploy/prod/.env ||
            { echo "deploy/prod/.env must set PROUDAUTH_IMAGE to ghcr.io/proudauth/proudauth:${GITHUB_REF_NAME#v}"; exit 1; }
          # The websites publish this guide as their quickstart; scripts/prepare-release.sh sets it.
          grep -qx "PROUDAUTH_IMAGE=ghcr.io/proudauth/proudauth:${GITHUB_REF_NAME#v}" docs/operations/docker-compose.md ||
            { echo "docs/operations/docker-compose.md must show PROUDAUTH_IMAGE=ghcr.io/proudauth/proudauth:${GITHUB_REF_NAME#v}; run scripts/prepare-release.sh"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The exact toolchain of the Dockerfile's build stage, so release
          # binaries and the image are built alike (DEP-003); raise both
          # together for standard-library fixes (TestReleaseToolchainPinned).
          go-version: "1.27.2"
      - name: Build binaries
        run: |
          mkdir -p dist
          for os in linux darwin; do for arch in amd64 arm64; do
            for cmd in identity-server identity-worker identity-cli; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -buildid= -X main.version=${GITHUB_REF_NAME}" \
                -o dist/${cmd}_${os}_${arch} ./cmd/${cmd}
            done
          done; done
      - name: Vulnerability scan of the release binaries
        # Same commands, platforms, toolchain and module versions as dist/,
        # built with symbol tables: govulncheck over-reports on stripped
        # (-s -w) binaries. Every shipped platform is scanned, since the
        # standard library differs per GOOS/GOARCH.
        run: |
          set -euo pipefail
          scan="${RUNNER_TEMP}/vulnscan"
          mkdir -p "$scan"
          for os in linux darwin; do for arch in amd64 arm64; do
            for cmd in identity-server identity-worker identity-cli; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "$scan/${cmd}_${os}_${arch}" ./cmd/$cmd
              echo "govulncheck ${cmd}_${os}_${arch}"
              go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary "$scan/${cmd}_${os}_${arch}"
            done
          done; done
      - name: SBOM
        run: go run github.com/anchore/syft/cmd/syft@v1.18.1 dir:. -o spdx-json=dist/sbom.spdx.json
      - name: Image
        id: image
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          REPOSITORY=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${REPOSITORY}
          VERSION=${GITHUB_REF_NAME#v}
          docker buildx create --name release-builder --driver docker-container \
            --driver-opt image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$GITHUB_REF_NAME" --build-arg VCS_REF="$(git rev-parse HEAD)" \
            --provenance=false --sbom=false --metadata-file image-metadata.json \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.description=ProudAuth identity server: one image configured by environment variables" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --annotation "index:org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${GITHUB_REF_NAME}" --push .
          # The immutable reference is the digest; tags are only labels (DEP-003).
          DIGEST=$(jq -er '."containerimage.digest"' image-metadata.json)
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}@${DIGEST}" > dist/IMAGE_DIGEST
          go run github.com/anchore/syft/cmd/syft@v1.18.1 ${IMAGE}@${DIGEST} --platform linux/amd64 -o spdx-json=dist/image-sbom.spdx.json
          go run github.com/anchore/syft/cmd/syft@v1.18.1 ${IMAGE}@${DIGEST} --platform linux/arm64 -o spdx-json=dist/image-sbom-linux-arm64.spdx.json
          # The offline image archive is explicitly the amd64 member of the index.
          docker pull --platform linux/amd64 "${IMAGE}:${VERSION}"
      - name: Offline bundle
        # After the image, so the bundle carries the published image as a
        # docker-save archive for air-gapped hosts (DEP-017).
        run: IMAGE_PLATFORM=linux/amd64 make bundle VERSION=${GITHUB_REF_NAME} IMAGE=${{ steps.image.outputs.name }}:${GITHUB_REF_NAME#v}
      - name: Source-free Compose installer
        run: ./scripts/package-deployment.sh "${GITHUB_REF_NAME}"
      - name: Image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Image SBOM attestation
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: dist/image-sbom.spdx.json
          push-to-registry: true
      - name: ARM64 image SBOM attestation
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: dist/image-sbom-linux-arm64.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image (keyless)
        run: cosign sign --yes ${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}
      # SHA256SUMS is written once, after every release file (binaries, SBOMs,
      # offline bundle, IMAGE_DIGEST, image SBOM) exists, and only then
      # attested: nothing may change dist/ between the checksums, the
      # attestation and the upload. RELEASE_NOTES.md is written afterwards and
      # is not a release asset.
      - name: Checksums
        run: cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
      - name: Release file provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Release notes for this tag
        run: |
          # Only this version's CHANGELOG section, not the whole file (GOV-005).
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v"\\]?" {p=1; print; next} p && /^## / {exit} p {print}' CHANGELOG.md > dist/RELEASE_NOTES.md
          [ -s dist/RELEASE_NOTES.md ] || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
          # Every release names its image, so the package and the install are one click away.
          {
            printf '\n## Docker image\n\n```sh\ndocker pull %s:%s\n```\n\n' "${{ steps.image.outputs.name }}" "${GITHUB_REF_NAME#v}"
            printf 'Digest: `%s` · Install: [Docker quickstart](https://proudauth.com/docs/getting-started/quickstart/)\n' "$(cat dist/IMAGE_DIGEST)"
          } >> dist/RELEASE_NOTES.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          options=()
          case "$GITHUB_REF_NAME" in *-*) options+=(--prerelease);; esac
          gh release create "${GITHUB_REF_NAME}" $(find dist -maxdepth 1 -type f ! -name RELEASE_NOTES.md) \
            --title "ProudAuth ${GITHUB_REF_NAME}" --notes-file dist/RELEASE_NOTES.md --verify-tag "${options[@]}"
          # Docker Hub mirroring is a separately verified maintainer operation;
          # no Hub credentials are stored in this GitHub repository/workflow.
      - name: Update the website now
        # proudauth.com syncs from the latest release every
        # hour; with a WEBSITES_DISPATCH_TOKEN secret (a fine-grained token with
        # Contents read/write on ProudAuth/proudauth-website) it redeploys now.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WEBSITES_DISPATCH_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "No WEBSITES_DISPATCH_TOKEN: the website picks up ${GITHUB_REF_NAME} within the hour."; exit 0; }
          for site in proudauth-website; do
            gh api "repos/proudauth/${site}/dispatches" -f event_type=proudauth-release -f "client_payload[tag]=${GITHUB_REF_NAME}"
            echo "Requested ${site} deployment for ${GITHUB_REF_NAME}"
          done
