# Generated by scripts/bench-local.sh. Production defaults except: development
# mode (plain-HTTP origin on 127.0.0.1 and the development mail sink), the
# budgets raised for one load source (docs/operations/benchmarks.md) and a
# short prepublish period so a rotation started during the soak run
# activates inside it.
mode: development
server:
  public_listen: "127.0.0.1:18591"
  internal_listen: "127.0.0.1:18592"
  public_origin: "http://127.0.0.1:18591"
storage:
  database_url: "file:$WORK/secrets/database_url"
keys:
  root_keys:
    - version: 1
      ref: "file:$WORK/secrets/root_key"
  active_version: 1
  prepublish_period: 2m
sessions:
  cookie_insecure_dev: true
security:
  rate_limits:
    login_per_ip: 1000000
    login_per_realm: 1000000
    login_per_client: 1000000
    token_per_client: 1000000
delivery:
  email:
    adapter: smtp
    smtp_host: 127.0.0.1
    smtp_port: 60548
    smtp_tls: none
workers:
  metrics_listen: "127.0.0.1:18593"
observability:
  log_format: json
