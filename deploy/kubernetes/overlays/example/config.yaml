mode: production
server:
  public_listen: ":8080"
  internal_listen: ":9090"            # proudauth-internal + NetworkPolicy, and the kubelet probes
  public_origin: "https://id.example.com"
  trusted_proxies: ["10.0.0.0/8"]     # your ingress controller's pod CIDR
  metrics_token: "file:/run/secrets/metrics_token"
identity:
  default_realm: main
storage:
  # Separate database roles (OPS-013, docs/operations/installation.md#database-roles):
  # the server and worker connect as the runtime role, which has data
  # privileges only; the migrate Job applies migrations as the schema owner,
  # then grants the runtime role. The owner's connection is in its own Secret,
  # mounted only into the Job (migrate-job-secrets.yaml), so keep
  # migrate_on_start off: the server and worker cannot read it.
  database_url: "file:/run/secrets/database_url"                                # proudauth_app
  migration_database_url: "file:/run/migration-secrets/migration_database_url"  # proudauth_owner
  runtime_role: proudauth_app
  max_conns: 20
keys:
  root_keys:
    - version: 1
      ref: "file:/run/secrets/root_key_v1"
  active_version: 1
delivery:
  email:
    adapter: smtp
    smtp_host: smtp.example.com
    smtp_port: 587
    smtp_tls: starttls
    smtp_username: proudauth
    smtp_password: "file:/run/secrets/smtp_password"
    from: "no-reply@example.com"
workers:
  # Private listener for the worker's /health/live (probes), /metrics and
  # /status; reachable only from the monitoring namespace (NetworkPolicy).
  metrics_listen: ":9091"
