# Mounts the schema owner's connection (storage.migration_database_url) into
# the migrate Job only: the server and worker pods never hold it, so a
# compromised pod cannot change the schema or the audit triggers (OPS-013). It
# needs a Secret of its own, since every pod mounts all of proudauth-secrets.
# The base stays unchanged, so overlays without separate roles need no
# second Secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: proudauth-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          volumeMounts:
            - {name: migration-secrets, mountPath: /run/migration-secrets, readOnly: true}
      volumes:
        - name: migration-secrets
          secret: {secretName: proudauth-migration-secrets, defaultMode: 0400}
